    <style>
        body {
            height: auto !important;
            min-height: 100vh;
            overflow-y: auto !important;
        }

        .menu-container {
            height: auto !important;
            min-height: 90vh;

            padding-bottom: 50px; 
        }
        
        .result-container {
            width: 100%;
            max-width: 800px;

        }
        .user-info {
            color: white;
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            margin-bottom: 25px;
            text-align: left;            
            padding-left: 15px;
        }

        .journey-status-grid {
            display: grid;

        }

        .card-jurusan.spesial {
            border-color: #f39c12 !important;

        }

        .badge-spesial {
            position: absolute;
            top: 12px;
            right: 12px;
            background: linear-gradient(45deg, #f39c12, #f1c40f);
            color: #000; 
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;

            padding: 3px 10px;
            border-radius: 4px;
            letter-spacing: 1px;

        }
        
        .card-jurusan.spesial .nama-jurusan {
            padding-right: 110px; 
        }
        .card-jurusan {
            background-color: rgba(0, 0, 0, 0.6);
            border: 2px solid #8c7853; 
            border-radius: 8px;
            padding: 20px;
            color: white;
            font-family: 'Cinzel', serif;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .card-jurusan.lolos {
            border-color: #2ecc71; 
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
        }
        .card-jurusan.gagal {
            border-color: #e74c3c; 
            box-sizing: border-box;
        }
        .nama-jurusan {
            font-family: 'Cinzel Decorative', serif;
            font-size: 1.2rem;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 5px;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .status-badge.lolos { background-color: #2ecc71; color: white; }
        .status-badge.gagal { background-color: #e74c3c; color: white; }
        
        .keterangan-gagal {
            font-size: 0.9rem;
            color: #ffb3b3;
            font-style: italic;
        }
        .loading-text {
            color: #8c7853;
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            text-align: center;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>

        function filterJurusan(skorUser, daftarJurusan) {
            for (let i = 0; i < daftarJurusan.length; i++) {
                let jurusanSekarang = daftarJurusan[i];
                let kriteriaMapel = jurusanSekarang.mapel;
                let lolosSemua = true;
                
                let totalSkorUser = 0;
                let jumlahMapelSyarat = 0;

                let listMapel = Object.keys(kriteriaMapel);                
                for (let j = 0; j < listMapel.length; j++) {
                    let mapel = listMapel[j]; 
                    let nilaiMinimal = kriteriaMapel[mapel];
                    let nilaiUser = skorUser[mapel] || 0;

                    if (nilaiUser < nilaiMinimal) {
                        lolosSemua = false;
                        break; 
                    }
                    
                    totalSkorUser += nilaiUser;
                    jumlahMapelSyarat++;
                }

                if (lolosSemua) {
                    jurusanSekarang.skorKecocokan = totalSkorUser / jumlahMapelSyarat;
                    arrlolos.push(jurusanSekarang);
                } else {
                    arrgagal.push(jurusanSekarang);
                }
            }
        }

        function cek_biokimmath(skorbio, skorchem, skormath) { filterJurusan({ biology: skorbio, chemistry: skorchem, math: skormath }, skorJurusan_biokimmat); }
        function cek_matfis(skormath, skorphysics) { filterJurusan({ math: skormath, physics: skorphysics }, skorJurusan_fismat); }

        function show_list() {
            const gridContainer = document.getElementById("journeyStatusGrid");
            gridContainer.innerHTML = ""; 

            arrlolos.sort((a, b) => b.skorKecocokan - a.skorKecocokan);

            const totalTop3 = Math.min(3, arrlolos.length);
            for (let i = 0; i < totalTop3; i++) {
                let data = arrlolos[i];
                let card = document.createElement("div");
                card.className = "card-jurusan lolos spesial"; 
                
                let htmlKonten = `<span class="badge-spesial" style="background:#f1c40f; color:#fff; padding:2px 8px; border-radius:4px; font-size:12px; font-weight:bold;">✨TOP `+(i+1)+`</span>`;
                htmlKonten += `<div class="nama-jurusan" style="font-weight:bold; margin-top:5px;">${data.jurusan.toUpperCase()}</div>`;
                htmlKonten += `<span class="status-badge lolos">SUCCESS ✅</span>`;
                htmlKonten += `<p style="margin: 5px 0 0 0; color: #2ecc71; font-size:14px;">Avg. Score Fit: ${Math.round(data.skorKecocokan)}%</p>`;
                
                card.innerHTML = htmlKonten;
                gridContainer.appendChild(card);
            }

            const tableContainer = document.createElement("div");
            tableContainer.style.gridColumn = "1 / -1"; 
            tableContainer.style.marginTop = "20px";
            
            let tableHTML = `
                <table style="width:100%; border-collapse: collapse; font-family: sans-serif; text-align: left; font-size: 14px;">
                    <thead>
                        <tr style="border-bottom: 2px solid #ddd; background-color: #f8f9fa; color: #333;">
                            <th style="padding: 12px 8px;">NAMA JURUSAN</th>
                            <th style="padding: 12px 8px;">STATUS</th>
                            <th style="padding: 12px 8px;">KETERANGAN</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            for (let i = 3; i < arrlolos.length; i++) {
                let data = arrlolos[i];
                tableHTML += `
                    <tr style="border-bottom: 1px solid #eee; background-color: #effaf3; color: #27ae60;">
                        <td style="padding: 12px 8px; font-weight: bold;">${data.jurusan.toUpperCase()}</td>
                        <td style="padding: 12px 8px; font-weight: bold;">PASSED</td>
                        <td style="padding: 12px 8px;">Memenuhi syarat (Avg: ${Math.round(data.skorKecocokan)}%)</td>
                    </tr>
                `;
            }

            for (let i = 0; i < arrgagal.length; i++) {
                let data = arrgagal[i];
                let mapelKurang = [];

                for (let mapel in data.mapel) {
                    let nilaiMinimal = data.mapel[mapel];
                    let nilaiUser = globalUserScores[mapel] || 0;
                    if (nilaiUser < nilaiMinimal) {
                        mapelKurang.push(mapel.charAt(0).toUpperCase() + mapel.slice(1) + ` (${nilaiUser}% < ${nilaiMinimal}%)`);
                    }
                }

                let keteranganGagal = "Tingkatkan mapel: " + mapelKurang.join(", ");

                tableHTML += `
                    <tr style="border-bottom: 1px solid #eee; background-color: #fdf2f2; color: #c0392b;">
                        <td style="padding: 12px 8px; font-weight: bold;">${data.jurusan.toUpperCase()}</td>
                        <td style="padding: 12px 8px; font-weight: bold;">FAILED</td>
                        <td style="padding: 12px 8px; font-size: 13px;">${keteranganGagal}</td>
                    </tr>
                `;
            }

            tableHTML += `</tbody></table>`;

            if (arrlolos.length > 3 || arrgagal.length > 0) {
                tableContainer.innerHTML = tableHTML;
                gridContainer.appendChild(tableContainer);
            }
        }

        function ambilDataArray2D() {
            fetch(SCRIPT_URL)
                .then(response => response.json())
                .then(matrixData => {
                    const loadingElement = document.getElementById("loading");
                    if (!matrixData || matrixData.length === 0) {
                        loadingElement.innerText = "No data found or sheet is empty.";
                        return;
                    }
                    loadingElement.style.display = "none";
                    
                    let userFound = false;
                    
                    globalUserScores = {
                        art: 0, biology: 0, chemistry: 0, civic: 0, economy: 0, 
                        english: 0, geography: 0, history: 0, indonesian: 0, informatics: 0, 
                        mandarin: 0, math: 0, pe: 0, physics: 0, religion: 0, sociology: 0
                    };

                    function bersihkanAngka(val) {
                        if (val === undefined || val === null || val === "") return 0;
                        let strVal = String(val).replace('%', '').trim();
                        let num = parseFloat(strVal);
                        if (isNaN(num)) return 0;
                        if (num > 0 && num <= 1 && !String(val).includes('%')) {
                            return Math.round(num * 100);
                        }
                        return Math.round(num);
                    }

                    for (let i = 0; i < matrixData.length; i++) {
                        let barisNama = matrixData[i][1]; // Kolom B = Nama
                        
                        if (barisNama && barisNama.toUpperCase().trim() === namaUser.trim()) {
                            userFound = true;
                            
                            // PEMETAAN KOLOM BERDASARKAN INPUT ANDA (C sampai R)
                            globalUserScores.art = bersihkanAngka(matrixData[i][2]);         // Col C
                            globalUserScores.biology = bersihkanAngka(matrixData[i][3]);     // Col D
                            globalUserScores.chemistry = bersihkanAngka(matrixData[i][4]);   // Col E
                            globalUserScores.civic = bersihkanAngka(matrixData[i][5]);       // Col F
                            globalUserScores.economy = bersihkanAngka(matrixData[i][6]);     // Col G
                            globalUserScores.english = bersihkanAngka(matrixData[i][7]);     // Col H
                            globalUserScores.geography = bersihkanAngka(matrixData[i][8]);   // Col I
                            globalUserScores.history = bersihkanAngka(matrixData[i][9]);     // Col J
                            globalUserScores.indonesian = bersihkanAngka(matrixData[i][10]); // Col K
                            globalUserScores.informatics = bersihkanAngka(matrixData[i][11]);// Col L
                            globalUserScores.mandarin = bersihkanAngka(matrixData[i][12]);   // Col M
                            globalUserScores.math = bersihkanAngka(matrixData[i][13]);       // Col N
                            globalUserScores.pe = bersihkanAngka(matrixData[i][14]);         // Col O
                            globalUserScores.physics = bersihkanAngka(matrixData[i][15]);    // Col P
                            globalUserScores.religion = bersihkanAngka(matrixData[i][16]);   // Col Q
                            globalUserScores.sociology = bersihkanAngka(matrixData[i][17]);  // Col R
                            break; 
                        }
                    }

                    if (userFound) {
                        cek_biokimmath(globalUserScores.biology, globalUserScores.chemistry, globalUserScores.math);
                        cek_matfis(globalUserScores.math, globalUserScores.physics);
                        cek_matfisinfor(globalUserScores.math, globalUserScores.informatics, globalUserScores.physics);
                        cek_matfiskim(globalUserScores.math, globalUserScores.physics, globalUserScores.chemistry);
                        cek_ekomat(globalUserScores.economy, globalUserScores.math);
                        cek_sosing(globalUserScores.sociology, globalUserScores.english);
                        cek_sosindo(globalUserScores.sociology, globalUserScores.indonesian);
                        cek_senbudinfor(globalUserScores.art, globalUserScores.informatics);
                        cek_biofis(globalUserScores.biology, globalUserScores.physics);
                        cek_ekosos(globalUserScores.economy, globalUserScores.sociology);
                        cek_matfisbio(globalUserScores.math, globalUserScores.physics, globalUserScores.biology);
                        cek_geomatfis(globalUserScores.geography, globalUserScores.math, globalUserScores.physics);
                        cek_mandsej(globalUserScores.mandarin, globalUserScores.history);
                        cek_pknsej(globalUserScores.civic, globalUserScores.history);
                        cek_pjokbio(globalUserScores.pe, globalUserScores.biology);
