<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVAL-SEA - Assessment Journey</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="art_culture.css">
</head>
<body>

    <div class="quiz-container">
        <div class="progress-wrapper">
            <span class="progress-text" id="progressText">JOURNEY PROGRESS: 0%</span>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
        </div>

        <div class="quiz-box">
            <h2 id="questionText" class="question-text">Loading question...</h2>
            <div class="options-container" id="optionsContainer">
                <button class="btn-option" onclick="submitAnswer(1)">CERTAIN</button>
                <button class="btn-option" onclick="submitAnswer(0)">UNCERTAIN</button>
            </div>
        </div>
    </div>

    <script>
        // =========================================================================
        // MASUKKAN URL WEB APP APPS SCRIPT BARU ANDA DI SINI
        // =========================================================================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZSBbbqt4-WSuqYu6_9OQ7ZI4J8Vtm7m1zVezECKtqOci8myr1WInD8zrerFBILw5T2w/exec";

        // Tulis nama mapel kuis ini dengan HURUF KECIL SEMUA (harus sama dengan teks di Google Sheets)
        const currentSubjectId = 'religion'; 

        const questions = [
            "Are you certain of these chapters below" +
        "<dl>" +
          "<dt>" +
             "<ol type='I'>" +
            "<li value='1'> Kesadaranku sebagai Manusia </li>" +
             "</ol>" +
          "</dt>" +
              "<dd><ol type='A'>" +
              "<li> Pribadi yang Unik </li>" +
              "<li> Mengembangkan Karunia Allah </li>" +
              "<li> Kesetaraan Laki-laki dan Perempuan </li>" +
              "<li> Belajar dari Kitab Suci </li>" +
              "</ol>" +
              "</dd>" +
        "</dl>",

"Are you certain of these chapters below" +
        "<dl>" +
          "<dt>" +
             "<ol type='I'>" +
            "<li value='2'> Keluhuran Manusia sebagai Citra Allah </li>" +
             "</ol>" +
          "</dt>" +
              "<dd><ol type='A'>" +
              "<li> Pengertian Citra Allah </li>" +
              "<li> Perendahan terhadap Martabat Manusia </li>" +
              "<li> Belajar dari Santo Vinsensius </li>" +
              "</ol>" +
              "</dd>" +
        "</dl>",

"Are you certain of these chapters below" +
        "<dl>" +
          "<dt>" +
             "<ol type='I'>" +
            "<li value='3'> Suara Hati </li>" +
             "</ol>" +
          "</dt>" +
              "<dd><ol type='A'>" +
              "<li> Pengertian Suara Hati </li>" +
              "<li> Segi-Segi Suara Hati </li>" +
              "<li> Pedoman Suara Hati </li>" +
              "<li> Cara Kerja Suara Hati </li>" +
              "<li> Fungsi Suara Hati </li>" +
              "<li> Kemerosotan Peranan Suara Hati dalam Masyarakat </li>" +
              "<li> Cara Membina Suara Hati </li>" +
              "<li> Belajar Membina Suara Hati Menurut Santo Vinsensius </li>" +
              "</ol>" +
              "</dd>" +
        "</dl>",

"Are you certain of these chapters below" +
        "<dl>" +
          "<dt>" +
             "<ol type='I'>" +
            "<li value='4'> Aku Mampu Bersikap Kritis dan Bertanggung Jawab </li>" +
             "</ol>" +
          "</dt>" +
              "<dd><ol type='A'>" +
              "<li> Aku Bersikap Kritis dan Bertanggung Jawab terhadap Media Massa </li>" +
              "<li> Aku Bersikap Kritis dan Bertanggung Jawab terhadap Ideologi dan Gaya Hidup yang Berkembang Dewasa Ini </li>" +
              "<li> Pandangan Gereja Katolik tentang Bersikap Kritis dan Bertanggung Jawab terhadap Gaya Hidup </li>" +
              "</ol>" +
              "</dd>" +
        "</dl>",

"Are you certain of these chapters below" +
        "<dl>" +
          "<dt>" +
             "<ol type='I'>" +
            "<li value='5'> Kitab Suci dan Tradisi </li>" +
             "</ol>" +
          "</dt>" +
              "<dd><ol type='A'>" +
              "<li> Sumber Ajaran Iman Gereja </li>" +
              "<li> Kitab Suci </li>" +
              "<li> Kitab Suci Perjanjian Lama </li>" +
              "<li> Kitab Suci Perjanjian Baru </li>" +
              "<li> Refleksi Perjanjian Baru dan Alasan Membaca Kitab Suci </li>" +
              "<li> Tradisi Gereja </li>" +
              "<li> Magisterium </li>" +
              "<li> Refleksi dari St. Vinsensius </li>" +
              "</ol>" +
              "</dd>" +
        "</dl>",

"Are you certain of these chapters below" +
        "<dl>" +
          "<dt>" +
             "<ol type='I'>" +
            "<li value='6'> Yesus Kristus Pejuang Kerajaan Allah </li>" +
             "</ol>" +
          "</dt>" +
              "<dd><ol type='A'>" +
              "<li> Latar Belakang Geografis, Politik, Ekonomi, Sosial, dan Religius Kerajaan Allah pada Zaman Yesus </li>" +
              "<li> Paham Kerajaan Allah yang Berkembang pada Zaman Yesus </li>" +
              "<li> Isi Pewartaan Yesus tentang Kerajaan Allah </li>" +
              "<li> Cara Yesus Mewartakan Kerajaan Allah </li>" +
              "<li> Refleksi atas perumpamaan Yesus </li>" +
              "<li> Kerajaan Allah dalam Refleksi St. Vinsensius </li>" +
              "</ol>" +
              "</dd>" +
        "</dl>",

"Are you certain of these chapters below" +
        "<dl>" +
          "<dt>" +
             "<ol type='I'>" +
            "<li value='7'> Sengsara, Wafat, dan Kebangkitan Yesus Kristus </li>" +
             "</ol>" +
          "</dt>" +
              "<dd><ol type='A'>" +
              "<li> Latar Belakang dan Alasan Yesus Dijauhi Hukuman Mati </li>" +
              "<li> Kisah Sengsara Yesus menurut Injil Lukas </li>" +
              "<li> Unsur Pokok Penampakan Yesus </li>" +
              "<li> Makna Sengsara dan Wafat Yesus </li>" +
              "<li> Sengsara dan Wafat Yesus dalam Refleksi St. Vinsensius </li>" +
              "<li> Kebangkitan Yesus: “Yesus sungguh Telah Bangkit” </li>" +
              "<li> Makna Kebangkitan Yesus </li>" +
              "</ol>" +
              "</dd>" +
        "</dl>",

"Are you certain of these chapters below" +
        "<dl>" +
          "<dt>" +
             "<ol type='I'>" +
            "<li value='8'> Yesus Kristus adalah Sahabat, Tokoh Idola, dan Juru Selamat Manusia </li>" +
             "</ol>" +
          "</dt>" +
              "<dd><ol type='A'>" +
              "<li> Yesus sebagai Tokoh Idolaku dan Sahabat Sejati </li>" +
              "<li> Yesus Putra Allah dan Juru Selamatku </li>" +
              "</ol>" +
              "</dd>" +
        "</dl>",

"Are you certain of these chapters below" +
        "<dl>" +
          "<dt>" +
             "<ol type='I'>" +
            "<li value='9'> Allah Tritunggal Mahakudus dan Peran Roh Kudus </li>" +
             "</ol>" +
          "</dt>" +
              "<dd><ol type='A'>" +
              "<li> Allah Tritunggal Mahakudus </li>" +
              "<li> Simbol dan Tanda mengenai Tritunggal Mahakudus </li>" +
              "<li> Peranan Roh Kudus </li>" +
              "<li> Karya dan Karunia Roh Kudus </li>" +
              "</ol>" +
              "</dd>" +
        "</dl>",
        ];

        // Memanggil namaUser dan tanggalInput dengan aman
        const namaUser = localStorage.getItem('namaUser') ? localStorage.getItem('namaUser').toUpperCase() : "GUEST";
        const tanggalInput = localStorage.getItem('tanggalInput') || new Date().toLocaleDateString();
        const kelasUser = localStorage.getItem('kelasUser') ? localStorage.getItem('kelasUser') : "-";

        let currentQuestionIndex = 0;
        let totalCertain = 0;

        function loadQuestion() {
            document.getElementById("questionText").innerHTML = questions[currentQuestionIndex];
            const progressPercentage = (currentQuestionIndex / questions.length) * 100;
            document.getElementById("progressBarFill").style.width = progressPercentage + "%";
            document.getElementById("progressText").innerText = `JOURNEY PROGRESS: ${Math.round(progressPercentage)}%`;
        }

        function submitAnswer(isCertain) {
            totalCertain += isCertain;
            currentQuestionIndex++;

            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                // KUIS SELESAI
                document.getElementById("progressBarFill").style.width = "100%";
                document.getElementById("progressText").innerText = "SAVING LOGS...";
                document.getElementById("questionText").innerText = "Processing your journey data...";
                
                document.getElementById("optionsContainer").style.pointerEvents = "none";
                document.getElementById("optionsContainer").style.opacity = "0.3";

                // LANGKAH 1: Paksa simpan memori centang di baris paling atas SEBELUM fetch internet dimulai
                const keyName = 'sub-' + currentSubjectId;
                localStorage.setItem(keyName, 'completed');

                // MENGHITUNG PERSENTASE
                let finalPercentage = Math.round((totalCertain / questions.length) * 100);

                // LANGKAH 2: Bungkus data skor untuk dikirim ke Google Sheets
                const formData = new FormData();
                formData.append("Nama", namaUser);
                formData.append("Kelas", kelasUser);
                formData.append("NamaSubject", currentSubjectId); 
                formData.append("NilaiSkor", finalPercentage + "%");          
                formData.append("Tanggal", tanggalInput);

                // LANGKAH 3: Tembak data ke spreadsheet
                fetch(GOOGLE_SCRIPT_URL, { 
                    method: 'POST', 
                    body: formData 
                })
                .then(response => {
                    // Sukses terkirim, langsung balik ke menu grid
                    window.location.href = "page3.html"; 
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    // Jika ada gangguan internet, tetap dipaksa balik agar centang lokal tetap menyala
                    window.location.href = "page3.html"; 
                });
            }
        }
 
        window.onload = loadQuestion;
    </script>

</body>
</html>
